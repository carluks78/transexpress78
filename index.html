
<!doctype html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#0A0A0B">
  <meta name="robots" content="index, follow, max-image-preview:large">

  <!-- SEO -->
  <title>TransExpress78 | Transport de marchandises et livraison express</title>

  <meta
    name="description"
    content="TransExpress78, transport de marchandises et livraison express depuis Mantes-la-Jolie. Transport professionnel en France et en Europe. Contactez-nous pour votre demande de transport."

  <meta name="author" content="TransExpress78">
  <meta name="publisher" content="TransExpress78">

  <link rel="icon" type="image/png" href="/logo-transexpress78.png">
  <link rel="apple-touch-icon" href="/logo-transexpress78.png">

  <!-- Open Graph : Facebook, WhatsApp, LinkedIn, Messenger -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="TransExpress78">
  <meta
    property="og:title"
    content="TransExpress78 | Votre partenaire transport"
  >
  <meta
    property="og:description"
    content="Transport de marchandises et livraison express depuis Mantes-la-Jolie, en France et en Europe. Découvrez nos solutions de transport professionnel."

  <meta property="og:url" content="https://transexpress78.fr/">
  <meta
    property="og:image"
    content="https://transexpress78.fr/logo-transexpress78.png"
  >
  <meta
    property="og:image:alt"
    content="Logo officiel TransExpress78"
  >
  <meta property="og:image:type" content="image/png">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary">
  <meta
    name="twitter:title"
    content="TransExpress78 | Transport et livraison"
  >
  <meta
    name="twitter:description"
    content="Transport de marchandises en France et en Europe depuis Mantes-la-Jolie."
  >
  <meta
    name="twitter:image"
    content="https://transexpress78.fr/logo-transexpress78.png"
  >
  <meta name="twitter:image:alt" content="Logo TransExpress78">

  <!-- SEO local et GEO : données structurées pour les moteurs de recherche et IA -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "@id": "https://transexpress78.fr/#organization",
    "name": "TransExpress78",
    "url": "https://transexpress78.fr/",
    "logo": {
      "@type": "ImageObject",
      "url": "https://transexpress78.fr/logo-transexpress78.png"
    },
    "image": "https://transexpress78.fr/logo-transexpress78.png",
    "description": "Transport de marchandises et livraison express depuis Mantes-la-Jolie, avec des solutions de transport professionnel en France et en Europe.",
    "areaServed": [
      {

        "name": "Mantes-la-Jolie"

      {
        "@type": "AdministrativeArea",
        "name": "Yvelines"
      },
      {
        "@type": "Country",
        "name": "France"
      },
      {
        "@type": "Place",
        "name": "Europe"
      }

    "knowsAbout": [
      "Transport de marchandises",
      "Transport express",
      "Livraison professionnelle",
      "Transport routier",
      "Transport national",
      "Transport européen"
    ]
  }
